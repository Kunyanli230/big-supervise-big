[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "big-supervise-big"
version = "0.1.0"
description = "Step-level same-family Decisions supervision of a coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mini-swe-agent==2.4.6", "httpx==0.28.1", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.15", "build>=1,<2"]

[project.scripts]
bsb = "big_supervise_big.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
